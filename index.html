<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor</title>
    <style>
        :root {
            --bg-color: #f3f2ef;
            --text-color: #000000e6;
            --container-bg: #ffffff;
            --control-group-bg: #f3f2ef;
            --button-bg: #0a66c2;
            --button-hover: #004182;
            --upload-bg: #0a66c2;
            --upload-hover: #004182;
            --timeline-bg: #e6e6e6;
            --timeline-track: #0a66c2;
            --border-color: #d0d0d0;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --hover-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1d2226;
            --text-color: #ffffff;
            --container-bg: #192734;
            --control-group-bg: #192734;
            --button-bg: #0a66c2;
            --button-hover: #004182;
            --upload-bg: #0a66c2;
            --upload-hover: #004182;
            --timeline-bg: #38434f;
            --timeline-track: #0a66c2;
            --border-color: #38434f;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --hover-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            background-color: var(--container-bg);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 30px;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .editor-container:hover {
            box-shadow: var(--hover-shadow);
            transform: translateY(-2px);
        }

        .video-preview {
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
            aspect-ratio: 16/9;
        }

        .video-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(0,0,0,0.1), transparent);
            pointer-events: none;
        }

        .video-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            background-color: var(--control-group-bg);
            padding: 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .control-group:hover {
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }

        .control-group h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: var(--text-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group h3::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background-color: var(--button-bg);
            border-radius: 2px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }

        button:active {
            transform: translateY(0);
        }

        input[type="file"] {
            display: none;
        }

        .file-upload {
            background-color: var(--upload-bg);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--card-shadow);
        }

        .file-upload:hover {
            background-color: var(--upload-hover);
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }

        .timeline {
            margin-top: 30px;
            background-color: var(--timeline-bg);
            height: 120px;
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .timeline-track {
            background-color: var(--timeline-track);
            height: 50px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .timeline-track::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--card-shadow);
            z-index: 1000;
        }

        .theme-toggle:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background-color: var(--button-bg);
            border-radius: 2px;
        }

        /* Add icons to buttons */
        .play-icon::before { content: '▶️'; }
        .pause-icon::before { content: '⏸️'; }
        .cut-icon::before { content: '✂️'; }
        .export-icon::before { content: '📤'; }
        .brightness-icon::before { content: '☀️'; }
        .contrast-icon::before { content: '⚖️'; }
        .upload-icon::before { content: '📁'; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙 Dark Mode</button>
    <div class="container">
        <h1>Video Editor</h1>
        <div class="editor-container">
            <div class="video-preview">
                <video id="videoPlayer" controls></video>
            </div>
            <div class="controls">
                <div class="control-group">
                    <h3>Import Video</h3>
                    <label class="file-upload upload-icon">
                        Choose Video
                        <input type="file" id="videoInput" accept="video/*">
                    </label>
                </div>
                <div class="control-group">
                    <h3>Basic Controls</h3>
                    <div class="button-group">
                        <button id="playPauseBtn" class="play-icon">Play/Pause</button>
                        <button id="cutBtn" class="cut-icon">Cut</button>
                        <button id="exportBtn" class="export-icon">Export</button>
                    </div>
                </div>
                <div class="control-group">
                    <h3>Effects</h3>
                    <div class="button-group">
                        <button id="brightnessBtn" class="brightness-icon">Brightness</button>
                        <button id="contrastBtn" class="contrast-icon">Contrast</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="timeline">
            <div class="timeline-track" id="timelineTrack"></div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const videoInput = document.getElementById('videoInput');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const cutBtn = document.getElementById('cutBtn');
        const exportBtn = document.getElementById('exportBtn');
        const timelineTrack = document.getElementById('timelineTrack');
        const themeToggle = document.getElementById('themeToggle');

        // Theme toggle functionality
        themeToggle.addEventListener('click', function() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
            
            // Save theme preference
            localStorage.setItem('theme', newTheme);
        });

        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = savedTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        }

        // Handle video file selection
        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                videoPlayer.src = videoURL;
            }
        });

        // Play/Pause button functionality
        playPauseBtn.addEventListener('click', function() {
            if (videoPlayer.paused) {
                videoPlayer.play();
                playPauseBtn.classList.remove('play-icon');
                playPauseBtn.classList.add('pause-icon');
                playPauseBtn.textContent = 'Pause';
            } else {
                videoPlayer.pause();
                playPauseBtn.classList.remove('pause-icon');
                playPauseBtn.classList.add('play-icon');
                playPauseBtn.textContent = 'Play';
            }
        });

        // Cut button functionality
        cutBtn.addEventListener('click', function() {
            // TODO: Implement cut functionality
            alert('Cut functionality will be implemented');
        });

        // Export button functionality
        exportBtn.addEventListener('click', function() {
            // TODO: Implement export functionality
            alert('Export functionality will be implemented');
        });

        // Update timeline as video plays
        videoPlayer.addEventListener('timeupdate', function() {
            const progress = (videoPlayer.currentTime / videoPlayer.duration) * 100;
            timelineTrack.style.width = progress + '%';
        });
    </script>
</body>
</html>
